name: PR Checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run governance checks
        run: Scripts/run_governance_checks.sh

  macos:
    name: macOS build & snapshots
    runs-on: macos-15
    needs: governance
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Run macOS checks
        run: Scripts/run_macos_checks.sh

  summary:
    name: Check summary
    runs-on: ubuntu-latest
    needs: [governance, macos]
    if: always()
    steps:
      - name: Report status
        run: |
          if [[ "${{ needs.governance.result }}" != "success" ]]; then
            echo "Governance checks failed."
            exit 1
          fi
          if [[ "${{ needs.macos.result }}" != "success" ]]; then
            echo "macOS checks failed."
            exit 1
          fi
          echo "All PR checks passed."