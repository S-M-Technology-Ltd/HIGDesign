name: Build and Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify docs and scripts
        run: |
          Scripts/verify_requirements_present.sh
          Scripts/verify_ui_guidelines_present.sh
          Scripts/verify_xcode_previews_present.sh
          Scripts/verify_view_naming.sh
          Scripts/verify_no_uikit.sh
          Scripts/verify_showcase_coverage.sh
          Scripts/verify_docc_coverage.sh
          Scripts/verify_showcase_snapshots_present.sh
      - name: Capture showcase snapshots
        run: Scripts/capture_showcase_snapshots.sh
      - name: Swift build (all platforms)
        run: Scripts/build_all_platforms.sh
      - name: Swift test (macOS)
        run: swift test --package-path .
      - name: Build Showcase (macOS)
        run: swift build --package-path . --target HIGShowcaseApp